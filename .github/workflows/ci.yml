name: AgroTracer CI

on:
  pull_request:
    branches: [develop, main, 'feature/S3-*']
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verificacoes:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Aplicar migrations no banco de teste
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Executar lint
        run: python -m flake8 app tests

      - name: Executar testes
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://agrotracer_ci:senha_ci_temporaria@localhost:55432/agrotracer_s2_t01_teste
          PYTHONPATH: backend
        run: python -m pytest -v -k "not test_s1_t01_postgres" #forçando commit de teste 

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrotracer_ci
          POSTGRES_PASSWORD: senha_ci_temporaria
          POSTGRES_DB: agrotracer_s2_t01_teste
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agrotracer_ci -d agrotracer_s2_t01_teste"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://agrotracer_ci:senha_ci_temporaria@127.0.0.1:55432/agrotracer_s2_t01_teste
      AGROTRACER_TEST_DATABASE_URL: postgresql+psycopg://agrotracer_ci:senha_ci_temporaria@127.0.0.1:55432/agrotracer_s2_t01_teste
