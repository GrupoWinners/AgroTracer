name: AgroTracer CI

on:
  pull_request:
    branches: [develop, main, 'feature/S3-*']
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verificacoes:
    runs-on: ubuntu-latest

    # 1. Injeta as variaveis de ambiente em TODOS os passos do job (Alembic + PyTest)
    env:
      DATABASE_URL: postgresql+psycopg2://agrotracer_ci:senha_ci_temporaria@127.0.0.1:55432/agrotracer_s2_t01_teste
      AGROTRACER_TEST_DATABASE_URL: postgresql+psycopg2://agrotracer_ci:senha_ci_temporaria@127.0.0.1:55432/agrotracer_s2_t01_teste
      PYTHONPATH: backend

    # 2. Servico container do PostgreSQL (Declarado no nivel do JOB, fora de steps)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrotracer_ci
          POSTGRES_PASSWORD: senha_ci_temporaria
          POSTGRES_DB: agrotracer_s2_t01_teste
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agrotracer_ci -d agrotracer_s2_t01_teste"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Executar lint
        run: python -m flake8 app tests

      - name: Aplicar migrations no banco de teste
        run: python -m alembic upgrade head

      - name: Executar testes
        run: python -m pytest -v -k "not test_s1_t01_postgres" -o env_files=
