[pytest]
# 1. Adiciona a pasta backend ao PYTHONPATH para resolver os imports (ex: from app.main import app)
pythonpath = backend

# 2. Configura o plugin pytest-asyncio para gerenciar as fixtures assíncronas do HTTPX
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 3. Formatação detalhada dos logs no terminal
addopts = -v --tb=short