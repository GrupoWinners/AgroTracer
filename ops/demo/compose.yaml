# Ambiente local SYNTHETIC. Nao reutiliza volumes/portas do compose principal.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrotracer_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?}
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d agrotracer_demo"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30
  api:
    build: ../../backend
    environment:
      DATABASE_URL: postgresql+psycopg://demo:${DEMO_DB_PASSWORD}@db/agrotracer_demo
      AGROTRACER_REDIS_URL: redis://redis:6379/0
      AGROTRACER_BRIDGE_SECRET: ${DEMO_HMAC:?}
      AGROTRACER_DEMO: '1'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${DEMO_API_PORT:-18000}:8000"]
  mysql:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DEMO_WP_DB_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${DEMO_WP_ROOT_PASSWORD:?}
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30
  wordpress:
    image: wordpress:6.8.3-php8.3-apache
    environment: &wp_env
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DEMO_WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      AGROTRACER_API_URL: http://api:8000
      AGROTRACER_API_HMAC_SECRET: ${DEMO_HMAC}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', false);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    depends_on:
      mysql: {condition: service_healthy}
    ports: ["127.0.0.1:${DEMO_WP_PORT:-18080}:80"]
    volumes:
      - wp:/var/www/html
      - ../../wordpress/agrotracer-bridge:/var/www/html/wp-content/plugins/agrotracer-bridge:ro
  cli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: '33:33'
    entrypoint: [wp]
    environment:
      <<: *wp_env
      HOME: /tmp
    volumes:
      - wp:/var/www/html
      - ../../wordpress/agrotracer-bridge:/var/www/html/wp-content/plugins/agrotracer-bridge:ro
volumes:
  pg:
  mysql:
  wp:
