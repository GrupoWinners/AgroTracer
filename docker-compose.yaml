services:
  db:
    image: postgres:16-alpine
    container_name: agrotracer-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agrotracer
      POSTGRES_USER: agrotracer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrotracer -d agrotracer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
